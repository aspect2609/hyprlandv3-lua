general {
    lock_cmd = pidof hyprlock || hyprlock       # dbus/sysd lock command (try hyprlock!)
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # turn on display after sleep
}

# Dim screen after 5 mins
listener {
    timeout = 300                                
    on-timeout = brightnessctl set 10% -s       # set brightness to 10% (save current)
    on-resume = brightnessctl -r                # restore brightness
}

# Lock screen after 10 mins
listener {
    timeout = 600                               
    on-timeout = loginctl lock-session          # lock screen
}

# Turn off screen after 10.5 mins
listener {
    timeout = 630                               
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'  # monitor off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'    # monitor on
}
