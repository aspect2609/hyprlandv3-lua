# Wallpaper colours: $wal_accent / $wal_clock / $wal_fg / $wal_bg, written by
# waybar/theme.sh ($wal_clock is picked to stand out from the wallpaper)
source = ~/.cache/wal/colors-hyprlock.conf

$info = ~/.config/hypr/scripts/lockinfo.sh

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

# Fingerprint unlock alongside the password (fprintd). Passwords go through
# system-auth: /etc/pam.d/hyprlock also has pam_fprintd, which would fight
# hyprlock over the scanner ("Device was already claimed").
auth {
    pam {
        module = system-auth
    }
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
    }
}

background {
    monitor =
    path = $wal_wallpaper # current wallpaper, set by waybar/theme.sh
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2 # 0 disables blurring
}

# TIME
label {
    monitor =
    text = $TIME
    color = $wal_clock
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -240
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $wal_clock
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -420
    halign = center
    valign = top
}

# GREETING
label {
    monitor =
    text = cmd[update:60000] $info greeting
    color = $wal_fg
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $wal_accent
    inner_color = $wal_bg
    font_color = $wal_fg
    fade_on_empty = false
    placeholder_text = <i>Enter Password</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

# FINGERPRINT STATUS
label {
    monitor =
    text = $FPRINTPROMPT
    color = $wal_fg
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -190
    halign = center
    valign = center
}

# NOW PLAYING (empty when nothing is playing)
label {
    monitor =
    text = cmd[update:5000] $info music
    color = $wal_fg
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}

# BATTERY
label {
    monitor =
    text = cmd[update:30000] $info battery
    color = $wal_fg
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -40, 40
    halign = right
    valign = bottom
}
