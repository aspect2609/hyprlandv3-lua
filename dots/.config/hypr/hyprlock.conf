# Wallpaper colours: $wal_accent / $wal_fg / $wal_bg, written by waybar/theme.sh
source = ~/.cache/wal/colors-hyprlock.conf

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = $wal_wallpaper # current wallpaper, set by waybar/theme.sh
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2 # 0 disables blurring
}

# TIME
label {
    monitor =
    text = $TIME
    color = $wal_accent
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -300
    halign = center
    valign = top
}

# USER
label {
    monitor =
    text = Type to Login
    color = $wal_fg
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $wal_accent
    inner_color = $wal_bg
    font_color = $wal_fg
    fade_on_empty = false
    placeholder_text = <i>Enter Password</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}