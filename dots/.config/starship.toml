# Tokyo Night prompt
add_newline = true
command_timeout = 500

format = """
[╭─](#414868)$directory$git_branch$git_status$python$nodejs$rust$golang$cmd_duration
[╰─](#414868)$character"""

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol   = "[❯](bold #f7768e)"

[directory]
style = "bold #7aa2f7"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[git_branch]
symbol = " "
style = "bold #bb9af7"
format = "[$symbol$branch]($style) "

[git_status]
style = "#e0af68"
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 2000
style = "#565f89"
format = "[took $duration]($style)"

[python]
symbol = " "
style = "#7dcfff"
format = '[$symbol$version]($style) '

[nodejs]
symbol = " "
style = "#9ece6a"
format = '[$symbol$version]($style) '

[rust]
symbol = " "
style = "#ff9e64"
format = '[$symbol$version]($style) '

[golang]
symbol = " "
style = "#7dcfff"
format = '[$symbol$version]($style) '
