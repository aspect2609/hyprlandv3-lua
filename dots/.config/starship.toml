# Prompt in ANSI colour names, so it follows the terminal's pywal palette
add_newline = true
command_timeout = 500

format = """
[╭─](bright-black)$directory$git_branch$git_status$python$nodejs$rust$golang$cmd_duration
[╰─](bright-black)$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 2000
style = "bright-black"
format = "[took $duration]($style)"

[python]
symbol = " "
style = "cyan"
format = '[$symbol$version]($style) '

[nodejs]
symbol = " "
style = "green"
format = '[$symbol$version]($style) '

[rust]
symbol = " "
style = "bright-red"
format = '[$symbol$version]($style) '

[golang]
symbol = " "
style = "cyan"
format = '[$symbol$version]($style) '
